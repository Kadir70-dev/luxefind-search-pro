name: LuxeFind plugin source checks
on:
  push:
  pull_request:
jobs:
  php-js-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check assets/search.js && node --check assets/editor.js
      - name: Mocked acceptance checks (not real WP integration)
        run: php tests/acceptance.php && php tests/fuzz.php
